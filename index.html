<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#12151d" id="meta-theme-color" />

    <title>SevnQuest - Petualangan Bahasa Jepang (N5 - N1)</title>
    <meta name="description" content="Aplikasi belajar bahasa Jepang (JLPT N5, N4, N3, N2, N1) dengan kanji, kotoba, tata bahasa, flashcard, dan latihan menulis kaligrafi." />

    <!-- Favicons & Brand Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Web App Manifest (PWA) -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Mobile & PWA Optimization for iOS & Android -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Critical Mobile Inline Style: Anti-FOUC, No Pull-to-Refresh Glitch, Touch Manipulation -->
    <style>
      :root { color-scheme: dark; }
      html.theme-light { color-scheme: light; }
      html {
        background-color: #12151d;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        overscroll-behavior-y: none;
      }
      html.theme-light { background-color: #eae7de; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root { isolation: isolate; }
    </style>

    <script>
      (function () {
        try {
          var s = localStorage.getItem('nihongo_quest_player_stats_v2') || localStorage.getItem('player_stats_v1');
          var isLight = false;
          if (s) {
            try { isLight = JSON.parse(s).theme === 'light'; } catch (e) {}
          }
          if (isLight) {
            document.documentElement.classList.add('theme-light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
            var meta = document.getElementById('meta-theme-color');
            if (meta) meta.setAttribute('content', '#eae7de');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('theme-light');
            document.documentElement.style.colorScheme = 'dark';
            var meta = document.getElementById('meta-theme-color');
            if (meta) meta.setAttribute('content', '#12151d');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Noto+Sans+JP:wght@500;700&family=Noto+Serif+JP:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Zen+Old+Mincho:wght@600;700;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-page text-text-primary antialiased selection:bg-gold selection:text-surface-base">
    <script>
      window.__pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__pwaInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });
    </script>
    <script>
      window.addEventListener('error', function (e) {
        console.error('[Global Crash Caught]:', e);
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          var box = document.getElementById('critical-crash-box');
          if (!box) {
            box = document.createElement('div');
            box.id = 'critical-crash-box';
            box.style.cssText = 'position:fixed;inset:16px;z-index:999999;padding:24px;background:#450a0a;color:#fecaca;border:2px solid #ef4444;border-radius:16px;font-family:monospace;overflow:auto;';
            document.body.appendChild(box);
          }
          box.innerHTML = '<h3 style="margin:0 0 12px 0;color:#f87171;font-size:16px;">⚠️ Gagal Memuat Modul Aplikasi (Script Error):</h3>' +
            '<div style="background:rgba(0,0,0,0.5);padding:12px;border-radius:8px;font-size:12px;white-space:pre-wrap;margin-bottom:12px;">' + (e.message || e.error || e) + '</div>' +
            '<div style="font-size:11px;color:#fca5a5;">Sumber: ' + (e.filename || 'unknown') + ':' + (e.lineno || '0') + '</div>' +
            '<button onclick="location.reload(true)" style="margin-top:16px;padding:8px 16px;background:#ef4444;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold;">Muat Ulang Halaman (Hard Refresh)</button>';
        }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.debug('ServiceWorker registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>
