<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nihongo Quest - RPG Belajar Bahasa Jepang (N5 - N1)</title>
    <meta name="description" content="Petualangan RPG menaklukkan 5 alam bahasa Jepang (JLPT N5, N4, N3, N2, N1) dengan sistem stage, kuis, kanji, dan dungeon boss battle." />
    <script>
      try {
        var s = localStorage.getItem('nihongo_quest_player_stats_v2') || localStorage.getItem('player_stats_v1');
        if (s && JSON.parse(s).theme === 'light') {
          document.documentElement.classList.add('theme-light');
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('theme-light');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&family=Noto+Sans+JP:wght@500;700&family=Noto+Serif+JP:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Zen+Old+Mincho:wght@600;700;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-page text-text-primary antialiased selection:bg-gold selection:text-surface-base">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
